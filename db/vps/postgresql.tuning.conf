# =============================================================================
# db/vps/postgresql.tuning.conf  →  se instala como conf.d/10-tuning.conf
# =============================================================================
# Valores calculados para un VPS de 4 GB RAM / 2 vCPU compartido con Next.js.
# Si el VPS tiene otra RAM, reajustar las 4 líneas marcadas [RAM].
# Regla rápida:
#   shared_buffers        = 25 %  de la RAM que le dejás a Postgres
#   effective_cache_size  = 60-70 % de esa RAM
#   maintenance_work_mem  = 512MB..1GB (acelera CREATE INDEX / VACUUM)
#   work_mem              = chico; se multiplica por conexión y por sort
# Si Next.js y Postgres comparten el box de 4 GB, "RAM para Postgres" ~= 2 GB.
# =============================================================================

# --- Memoria [RAM] -----------------------------------------------------------
shared_buffers = 512MB
effective_cache_size = 1536MB
maintenance_work_mem = 512MB
work_mem = 16MB

# --- Planner (disco SSD, la base y la app en la misma máquina) --------------
random_page_cost = 1.1
effective_io_concurrency = 200

# --- Conexiones ------------------------------------------------------------
# La app usa un pool chico (postgres.js, max ~10-15). No hace falta más.
max_connections = 60

# --- WAL / checkpoints (menos I/O en ráfaga) --------------------------------
wal_compression = on
checkpoint_completion_target = 0.9
max_wal_size = 2GB
min_wal_size = 512MB

# --- pgvector HNSW ---------------------------------------------------------
# ef_search: más alto = mejor recall, más lento. 40 es el default.
# Con el pool de 200 candidatos de hybrid_search, 100 es un buen punto.
hnsw.ef_search = 100
# pgvector >= 0.8: permite que la búsqueda vectorial CON filtros WHERE
# siga usando el índice en vez de caer a scan exacto. Clave para este proyecto.
hnsw.iterative_scan = 'relaxed_order'

# --- Observabilidad ------------------------------------------------------
pg_stat_statements.track = top
track_io_timing = on
log_min_duration_statement = 500   # loguea toda query > 500 ms
log_line_prefix = '%m [%p] %u@%d '

# --- Autovacuum un poco más agresivo (tabla products se actualiza en syncs) -
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05
