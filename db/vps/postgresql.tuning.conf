# =============================================================================
# db/vps/postgresql.tuning.conf  →  se instala como conf.d/10-tuning.conf
# =============================================================================
# Calculado para el VPS real: 7,8 GB RAM totales / 2 vCPU, compartido con la
# app Next.js (que ya usa ~4 GB) → deja ~3,5 GB para Postgres + margen.
# La base entera pesa ~87 MB, así que entra de sobra en shared_buffers.
# =============================================================================

# --- Memoria ---------------------------------------------------------------
shared_buffers = 512MB          # la base (87 MB) entra varias veces
effective_cache_size = 2GB      # estimación de lo que el SO cachea
maintenance_work_mem = 256MB    # CREATE INDEX / VACUUM; moderado (sin swap)
work_mem = 16MB

# --- Planner (disco SSD, la base y la app en la misma máquina) --------------
random_page_cost = 1.1
effective_io_concurrency = 200

# --- Conexiones ------------------------------------------------------------
# La app usa un pool chico (postgres.js, max 12). No hace falta más.
max_connections = 40

# --- WAL / checkpoints (menos I/O en ráfaga) --------------------------------
wal_compression = on
checkpoint_completion_target = 0.9
max_wal_size = 2GB
min_wal_size = 512MB

# --- pgvector HNSW ---------------------------------------------------------
# ef_search: más alto = mejor recall, más lento. 40 es el default.
# Con el pool de 200 candidatos de hybrid_search, 100 es un buen punto.
hnsw.ef_search = 100
# pgvector >= 0.8: permite que la búsqueda vectorial CON filtros WHERE
# siga usando el índice en vez de caer a scan exacto. Clave para este proyecto.
hnsw.iterative_scan = 'relaxed_order'

# --- Observabilidad ------------------------------------------------------
pg_stat_statements.track = top
track_io_timing = on
log_min_duration_statement = 500   # loguea toda query > 500 ms
log_line_prefix = '%m [%p] %u@%d '

# --- Autovacuum un poco más agresivo (tabla products se actualiza en syncs) -
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05
